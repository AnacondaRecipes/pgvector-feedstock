{% set name = "pgvector" %}
{% set version = "0.8.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/{{ name }}/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: a9094dfb85ccdde3cbb295f1086d4c71a20db1d26bf1d6c39f07a7d164033eb4

build:
  number: 1
  # Plugin never DT_NEEDs libpq; host postgresql still exports it.
  ignore_run_exports:
    - libpq

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - perl
    - gnuconfig       # [unix]
    - make            # [unix]
    - lld             # [osx]
  host:
    - postgresql {{ libpq }}
    - libpq {{ libpq }}         # [not win]
  run:
    # Server major is the runtime coupling (vector.dll imports postgres.exe;
    # unix vector.so is a loadable module). libpq is not linked — its
    # run_exports from host postgresql are ignored above.
    - postgresql {{ libpq }}.*

test:
  commands:
    - test -f $PREFIX/lib/vector.so                                                     # [linux]
    - test -f $PREFIX/lib/vector.dylib                                                  # [osx]
    - test -f $PREFIX/include/server/extension/vector/vector.h                          # [unix]
    - test -f $PREFIX/share/extension/vector--{{ version }}.sql                         # [unix]
    - test -f $PREFIX/share/extension/vector.control                                    # [unix]
    - if not exist %LIBRARY_LIB%\vector.dll exit 1                                      # [win]
    - if not exist %LIBRARY_INC%\server\extension\vector\vector.h exit 1                # [win]
    - if not exist %LIBRARY_PREFIX%\share\extension\vector--{{ version }}.sql exit 1    # [win]
    - if not exist %LIBRARY_PREFIX%\share\extension\vector.control exit 1               # [win]


about:
  home: https://github.com/pgvector/pgvector
  summary: Open-source vector similarity search for Postgres.
  description: Open-source vector similarity search for Postgres.
  license: PostgreSQL
  license_family: Other
  license_file: LICENSE
  doc_url: https://github.com/pgvector/pgvector
  dev_url: https://github.com/pgvector/pgvector

extra:
  recipe-maintainers:
    - mmcauliffe
